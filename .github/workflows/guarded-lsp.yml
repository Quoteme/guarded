name: Build guarded LSP

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # asset names are `guarded-<uname -s>-<uname -m>`, as the Neovim plugin expects
          - { os: ubuntu-latest, asset: guarded-Linux-x86_64 }
          - { os: macos-latest, asset: guarded-Darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ matrix.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - run: lake build && cp .lake/build/bin/guarded ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update the guarded-lsp release
        uses: softprops/action-gh-release@v2
        with:
          # fixed tag: the Neovim plugin downloads from releases/download/guarded-lsp/
          tag_name: guarded-lsp
          name: guarded LSP
          body: Built from ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: guarded-*
