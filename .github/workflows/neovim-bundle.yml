name: Bundle Neovim plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # asset names are `guarded-<uname -s>-<uname -m>`, as the Neovim plugin expects
          - { os: ubuntu-latest, asset: guarded-Linux-x86_64 }
          - { os: macos-latest, asset: guarded-Darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ matrix.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # strip (103 MB -> 72 MB) and compress (-> ~16 MB); build.lua unpacks it
      - run: |
          lake build
          strip -o ${{ matrix.asset }} .lake/build/bin/guarded
          chmod +x ${{ matrix.asset }}
          xz -9 ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.xz

  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: editor-integration/neovim/bin

      # the `nvim` branch is the Neovim plugin with the compressed binaries in bin/;
      # force-pushed as a single commit so old binaries do not pile up
      - name: Publish the nvim branch
        working-directory: editor-integration/neovim
        run: |
          chmod +x bin/*
          git init -q -b nvim
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "Neovim plugin built from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" nvim
